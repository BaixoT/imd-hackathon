# BunkerVault research build. Local tests only: no RPC endpoints, keys or deployment secrets here.
[profile.default]
src = "src"
test = "test"
script = "script"
out = "out"
libs = ["lib"]
solc_version = "0.8.30"
evm_version = "cancun"
optimizer = true
optimizer_runs = 200
bytecode_hash = "none"
cbor_metadata = true
chain_id = 31337
gas_limit = 9223372036854775807
# Tests read vectors and artifacts. FFI stays off unless asked (see README).
fs_permissions = [
  { access = "read", path = "./" },
  { access = "read-write", path = "./cache/ffi" },
]
remappings = [
  "@openzeppelin/contracts/=lib/openzeppelin-contracts/contracts/",
  "forge-std/=lib/forge-std/src/",
]

# The vendored research verifier keeps its upstream IR/optimizer settings. Cancun matches the target chain.
# This is not bytecode equivalence with upstream's Osaka build.
additional_compiler_profiles = [{ name = "ir", via_ir = true, optimizer_runs = 10000 }]
compilation_restrictions = [
  { paths = "test/vendor/fireblocks/MLDSA44Verifier.sol", via_ir = true, optimizer_runs = 10000 },
]

[fuzz]
runs = 256
seed = "0xb0c4e7"

[lint]
lint_on_build = false
